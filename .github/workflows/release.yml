name: Prepare Windows x64 release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Numeric release tag, for example v1.1.17
        required: true
        type: string
      publish:
        description: Publish after every verification succeeds
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: terrieflow-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-msvc
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0

    steps:
      - name: Validate requested tag
        shell: pwsh
        run: |
          if ('${{ inputs.tag }}' -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release tags must be numeric: vMAJOR.MINOR.PATCH'
          }

      - name: Checkout requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, main ancestry, and package version
        shell: pwsh
        run: |
          $tagCommit = git rev-parse "refs/tags/${{ inputs.tag }}^{commit}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tagCommit = "$tagCommit".Trim()
          if ($tagCommit -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Requested release tag does not resolve to one commit'
          }
          $checkedOutCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkedOutCommit = "$checkedOutCommit".Trim()
          if ($checkedOutCommit -cne $tagCommit) {
            throw 'Checked out commit does not match the requested release tag'
          }
          # Release tag must point to a commit contained in main.
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content -Raw apps/multicore-desktop/Cargo.toml
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$')
          if (-not $match.Success) { throw 'Desktop package version was not found' }
          $version = $match.Groups[1].Value
          if ('${{ inputs.tag }}' -cne "v$version") { throw 'Tag does not match the desktop version' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enforce release gate
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows-release.ps1 -AssertReleaseReady
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify source and release contracts
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in @(
            'scripts/test-package-windows-release.ps1',
            'scripts/test-smoke-test-one-click-contract.ps1',
            'scripts/test-packaged-daemon-smoke-contract.ps1',
            'scripts/test-windows-installer-contract.ps1',
            'scripts/test-release-workflow-contract.ps1'
          )) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build patched Mihomo for Windows x64
        shell: pwsh
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) { throw 'Git Bash is required' }
          & 'C:\Program Files\Git\bin\bash.exe' scripts/build-mihomo.sh --output dist/mihomo --cache "$env:RUNNER_TEMP/mihomo-cache" windows-amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MULTICORE_MIHOMO_BINARIES_DIR=$((Resolve-Path 'dist/mihomo').Path)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify repository-pinned Skia release archive
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw packaging/windows-x64/versions.json | ConvertFrom-Json
          $pin = $manifest.build.skiaBinaries
          $directory = (Resolve-Path 'build-support/release-dependencies/skia').Path
          $archive = Join-Path $directory "skia-binaries-$($pin.key).tar.gz"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Pinned Skia archive is unavailable: $archive"
          }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne [string]$pin.sha256) { throw 'Provisioned Skia archive checksum mismatch' }
          "MULTICORE_SKIA_BINARIES_DIR=$directory" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify Windows x64 portable bundle
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows-release.ps1 `
            -DestinationPath dist/release/terrieflow-windows-x64 `
            -UpdateRepository Terrieggwp/terrieflow-client `
            -ReleaseAssetPath dist/release/TerrieFlow-Client-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-elevation-manifest.ps1 `
            -DesktopExecutablePath dist/release/terrieflow-windows-x64/TerrieFlow.exe `
            -DaemonExecutablePath dist/release/terrieflow-windows-x64/runtime/multicore-daemon.exe `
            -UpdaterExecutablePath dist/release/terrieflow-windows-x64/runtime/multicore-updater.exe `
            -CoreHostExecutablePath dist/release/terrieflow-windows-x64/runtime/multicore-core-host.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MULTICORE_RELEASE_BUNDLE = (Resolve-Path 'dist/release/TerrieFlow-Client-windows-x64.zip').Path
          cargo test -p multicore-release --test archive_contract built_release_bundle_matches_updater_contract --locked -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-test-packaged-daemon.ps1 `
            -PackagePath dist/release/terrieflow-windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ($actual -cne $expected) { throw 'Inno Setup checksum mismatch' }
          $process = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER') `
            -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }

      - name: Build and smoke-test Windows x64 installer
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-installer.ps1 `
            -PackagePath dist/release/terrieflow-windows-x64 `
            -OutputDirectory dist/release `
            -AppVersion $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-test-windows-installed-update.ps1 `
            -InstallerPath dist/release/TerrieFlow-Client-Setup-x64.exe `
            -PackagePath dist/release/terrieflow-windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve corresponding source archives
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw packaging/windows-x64/versions.json | ConvertFrom-Json
          $xray = 'dist/release/Xray-core-source.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $manifest.components.xray.source.url -OutFile $xray
          $actual = (Get-FileHash -LiteralPath $xray -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne [string]$manifest.components.xray.source.sha256) { throw 'Xray source checksum mismatch' }
          Copy-Item -LiteralPath dist/mihomo/mihomo-source.zip -Destination dist/release/mihomo-source.zip

      - name: Create checksums and release notes
        shell: pwsh
        run: |
          $assets = @(
            'dist/release/TerrieFlow-Client-Setup-x64.exe',
            'dist/release/TerrieFlow-Client-windows-x64.zip',
            'dist/release/Xray-core-source.zip',
            'dist/release/mihomo-source.zip'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$([IO.Path]::GetFileName($asset))"
          }
          $checksums | Set-Content -LiteralPath dist/release/RELEASE-SHA256SUMS.txt -Encoding ascii
          $releaseNotes = "docs/release-notes-$env:APP_VERSION.md"
          if (-not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw "Missing release notes: $releaseNotes"
          }
          Copy-Item -LiteralPath $releaseNotes -Destination dist/release/RELEASE_NOTES.md
          @(
            'dist/release/TerrieFlow-Client-Setup-x64.exe',
            'dist/release/TerrieFlow-Client-windows-x64.zip',
            'dist/release/RELEASE-SHA256SUMS.txt',
            'dist/release/Xray-core-source.zip',
            'dist/release/mihomo-source.zip'
          ) | Set-Content -LiteralPath dist/release/RELEASE-ASSETS.txt -Encoding utf8

          $candidateAssets = @(
            'dist/release/TerrieFlow-Client-Setup-x64.exe',
            'dist/release/TerrieFlow-Client-windows-x64.zip',
            'dist/release/RELEASE-SHA256SUMS.txt',
            'dist/release/RELEASE_NOTES.md',
            'dist/release/RELEASE-ASSETS.txt',
            'dist/release/Xray-core-source.zip',
            'dist/release/mihomo-source.zip'
          )
          $candidateChecksums = foreach ($asset in $candidateAssets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$([IO.Path]::GetFileName($asset))"
          }
          $candidateChecksums | Set-Content -LiteralPath dist/release/CANDIDATE-SHA256SUMS.txt -Encoding ascii

      - name: Upload verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terrieflow-windows-x64-${{ inputs.tag }}
          path: |
            dist/release/TerrieFlow-Client-Setup-x64.exe
            dist/release/TerrieFlow-Client-windows-x64.zip
            dist/release/RELEASE-SHA256SUMS.txt
            dist/release/RELEASE_NOTES.md
            dist/release/RELEASE-ASSETS.txt
            dist/release/Xray-core-source.zip
            dist/release/mihomo-source.zip
            dist/release/CANDIDATE-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    environment: terrieflow-release
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout publication scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download verified release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terrieflow-windows-x64-${{ inputs.tag }}
          path: dist/release

      - name: Verify release candidate handoff
        shell: pwsh
        run: |
          $directory = (Resolve-Path 'dist/release').Path
          $manifestPath = Join-Path $directory 'CANDIDATE-SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw 'Release candidate checksum manifest is missing'
          }
          $expectedNames = @(
            'TerrieFlow-Client-Setup-x64.exe',
            'TerrieFlow-Client-windows-x64.zip',
            'RELEASE-SHA256SUMS.txt',
            'RELEASE_NOTES.md',
            'RELEASE-ASSETS.txt',
            'Xray-core-source.zip',
            'mihomo-source.zip'
          )
          $seen = @{}
          foreach ($line in Get-Content -LiteralPath $manifestPath) {
            if ($line -cnotmatch '^([0-9a-f]{64}) \*([^\\/]+)$') {
              throw "Invalid candidate checksum line: $line"
            }
            $expectedHash = $Matches[1]
            $name = $Matches[2]
            if ($name -notin $expectedNames -or $seen.ContainsKey($name)) {
              throw "Unexpected or duplicate candidate asset: $name"
            }
            $path = Join-Path $directory $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Candidate asset is missing: $name"
            }
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -cne $expectedHash) { throw "Candidate checksum mismatch: $name" }
            $seen[$name] = $true
          }
          if ($seen.Count -ne $expectedNames.Count) { throw 'Candidate checksum manifest is incomplete' }

      - name: Publish release to official update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/publish-github-release.ps1 `
            -Repository Terrieggwp/terrieflow-client `
            -Tag '${{ inputs.tag }}' `
            -Target main `
            -Title "TerrieFlow Client ${{ inputs.tag }}" `
            -NotesPath dist/release/RELEASE_NOTES.md `
            -AssetManifest dist/release/RELEASE-ASSETS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Point release.txt at the published version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.tag }}'.Substring(1)
          $uri = 'https://api.github.com/repos/Terrieggwp/terrieflow-client/contents/release.txt'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $current = Invoke-RestMethod -Uri "$uri`?ref=main" -Headers $headers
          $body = @{
            message = "release: $version"
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$version`n"))
            sha = $current.sha
            branch = 'main'
          } | ConvertTo-Json
          Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -Body $body `
            -ContentType 'application/json; charset=utf-8' | Out-Null
